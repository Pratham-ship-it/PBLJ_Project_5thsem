spring.application.name=student-management

# Server Port (8080 is used by Apache/httpd on this machine)
server.port=8081

# Default Database: H2 in-memory (allows the project to run immediately without requiring local MySQL)
spring.datasource.url=jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- MySQL Configuration ---
# To switch to MySQL, uncomment the lines below and ensure MySQL is running with database 'student_db'
# spring.datasource.url=jdbc:mysql://localhost:3306/student_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
